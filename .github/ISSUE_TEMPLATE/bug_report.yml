name: Bug report
description: Report a problem with seatwise.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not report security issues here. See SECURITY.md for the private reporting process.

        Do not paste org UUIDs, org names, account emails, tokens or private folder names. seatwise already replaces identifiers with placeholders such as `<org:work>` when its output is piped (`seat doctor | cat`), so copy from piped output.

  - type: input
    id: version
    attributes:
      label: seatwise version
      description: Output of `seat --version`.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS name, version, and architecture.
      placeholder: "e.g. macOS 15.5 arm64"
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: Claude Code (`claude --version`) or Codex (`codex --version`), and whether you use the desktop app.
      placeholder: "e.g. Claude Code 2.1.0, desktop app and CLI"
    validations:
      required: true

  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The exact command, with identifiers and secrets removed.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: seat doctor
      description: Output of `seat doctor | cat` (piped, so identifiers are replaced). Check it before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed org UUIDs, org names, emails, tokens and private folder names from this report.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
