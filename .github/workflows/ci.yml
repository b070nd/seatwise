name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # The repository ruleset requires one check named "test". The matrix runs
  # under its own names and the "test" job below reports their combined result.
  platforms:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  test:
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no private notes, local tooling or live configuration is tracked
        run: |
          tracked=$( (git ls-files | grep -E '^(reference|\.claude)/'; git ls-files | grep -E '(^|/)config\.toml$|(^|/)\.env' ) || true)
          if [ -n "$tracked" ]; then
            echo "These must stay out of git:"
            echo "$tracked"
            exit 1
          fi
      - run: test "${{ needs.platforms.result }}" = "success"
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
