# Combinations Claude Code documents. A rule fires when every key in `when` is set (to `is`, when given).
[[rule]]
when = [{ key = "alwaysThinkingEnabled", is = false }, { key = "MAX_THINKING_TOKENS" }]
level = "warn"
message = "MAX_THINKING_TOKENS above 0 turns thinking on even with alwaysThinkingEnabled = false"

[[rule]]
when = [{ key = "effortLevel" }, { key = "CLAUDE_CODE_EFFORT_LEVEL" }]
level = "warn"
message = "CLAUDE_CODE_EFFORT_LEVEL overrides effortLevel, so effortLevel has no effect"

[[rule]]
when = [{ key = "model" }, { key = "ANTHROPIC_MODEL" }]
level = "warn"
message = "ANTHROPIC_MODEL overrides model, so model has no effect"

[[rule]]
when = [{ key = "vimInsertModeRemaps" }]
unless = [{ key = "editorMode", is = "vim" }]
level = "warn"
message = "vimInsertModeRemaps has no effect unless editorMode is vim"

[[rule]]
when = [{ key = "includeCoAuthoredBy" }, { key = "attribution" }]
level = "warn"
message = "attribution replaces includeCoAuthoredBy for the parts it sets"

[[rule]]
when = [{ key = "sandbox.failIfUnavailable", is = true }]
unless = [{ key = "sandbox.enabled", is = true }]
level = "warn"
message = "sandbox.failIfUnavailable only matters when sandbox.enabled is true"

[[rule]]
when = [{ key = "autoCompactEnabled", is = false }, { key = "autoCompactWindow" }]
level = "warn"
message = "autoCompactWindow has no effect while autoCompactEnabled is false"

[[rule]]
when = [{ key = "CLAUDE_CODE_EXPERIMENTAL_CODE_MODE", is = "1" }, { key = "permissions.defaultMode", is = "auto" }]
level = "info"
message = "in auto mode a classifier reviews each Code Mode script before it runs"
