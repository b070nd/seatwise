shape = "string[] IPv4 CIDRs (/8–/32, max 4); v2.1.268+"
scopes = ["managed"]
since = "2.1.268"

[[setting]]
name = "gcpAuthRefresh"
type = "string"
meaning = "refresh Google ADC when expired"
shape = "string (command)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "hooks"
