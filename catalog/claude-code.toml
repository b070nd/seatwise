[[setting]]
name = "language"
type = "string"
meaning = "response language"
shape = "string (any language name, not validated)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "managedMcpServers"
type = "object"
meaning = "provide remote MCP servers to all users"
shape = "object {name: http|sse entry with https url}; v2.1.259+"
scopes = ["managed"]
since = "2.1.259"

[[setting]]
name = "managedSourcesBehavior"
