meaning = "lifecycle hooks"
shape = "object {event: [{matcher, hooks: [{type: command|prompt|agent|http|mcp_tool, ...}]}]}"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "httpHookAllowedEnvVars"
type = "list"
meaning = "env vars HTTP hooks may put in headers"
shape = "string[] (env var names)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "idleCompaction"
type = "bool"
meaning = "compact idle long conversations"
scopes = ["user", "project", "local", "managed", "session"]
since = "2.1.290"

[[setting]]
name = "includeCoAuthoredBy"
type = "bool"
meaning = "DEPRECATED; use attribution"
scopes = ["user", "project", "local", "managed", "session"]
stability = "deprecated"

[[setting]]
name = "includeGitInstructions"
type = "bool"
meaning = "include git instructions and status snapshot"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "inputNeededNotifEnabled"
type = "bool"
meaning = "push notification when input needed"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "isolatePeerMachines"
type = "bool"
meaning = "prompt before cross-machine messages (true from any scope)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "keybindingFlavor"
type = "enum"
values = ["classic", "readline"]
meaning = "DEPRECATED (v2.1.261), no effect"
scopes = ["user", "project", "local", "managed", "session"]
