# Claude Code settings and environment variables seatwise knows about.
#
# Sources: https://code.claude.com/docs/en/settings-reference and https://code.claude.com/docs/en/env-vars,
# read 2026-11-23 (newest version gate seen: v2.1.330). `scopes` lists where Claude Code honors a value:
# user (~/.claude/settings.json), project (.claude/settings.json), local (.claude/settings.local.json), managed,
# session (--settings, which seatwise uses for session presets), shell (the launch environment), global
# (~/.claude.json). Update this file when Claude Code adds or changes settings; `seat settings` reads it.

[[setting]]
name = "advisorModel"
type = "enum"
values = ["fable", "opus"]
meaning = "model used for advisor tool; unset = off"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "agent"
type = "string"
meaning = "run main thread as named subagent"
shape = "string"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "agentPushNotifEnabled"
type = "bool"
meaning = "allow Claude phone push notifications"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "allowAllClaudeAiMcps"
type = "bool"
meaning = "keep claude.ai connectors beside managed-mcp.json"
scopes = ["managed"]

[[setting]]
name = "allowClaudeInChromeWithManagedMcp"
type = "bool"
meaning = "Chrome server runs beside managed-mcp.json; v2.1.282+"
scopes = ["managed"]
since = "2.1.282"

[[setting]]
name = "allowedChannelPlugins"
type = "list"
meaning = "channel plugin allowlist replacing default"
shape = "array of {marketplace,plugin} or \"plugin@marketplace\""
scopes = ["managed"]

[[setting]]
name = "allowedHttpHookUrls"
type = "list"
meaning = "limit URLs HTTP hooks may target"
shape = "string[] (URL patterns, * wildcard)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "allowedMcpServers"
type = "list"
meaning = "MCP server allowlist for users"
shape = "array of {serverName}|{serverCommand}|{serverUrl}"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "allowedProviders"
type = "list"
meaning = "which API providers machine may use; v2.1.285+"
shape = "string[] [anthropic, bedrock, vertex, foundry, anthropicAws, anthropicGoogleCloud, mantle, customEndpoint, gateway]"
scopes = ["managed"]
since = "2.1.285"

[[setting]]
name = "allowManagedHooksOnly"
type = "bool"
meaning = "run only managed/SDK/force-enabled plugin hooks"
scopes = ["managed"]

[[setting]]
name = "allowManagedMcpServersOnly"
type = "bool"
meaning = "only managed allowedMcpServers apply"
scopes = ["managed"]

[[setting]]
name = "allowManagedPermissionRulesOnly"
type = "bool"
meaning = "managed settings sole source of permission rules"
scopes = ["managed"]

[[setting]]
name = "alwaysThinkingEnabled"
type = "bool"
meaning = "false turns extended thinking off"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "apiKeyHelper"
type = "string"
meaning = "command printing the API credential"
shape = "string (shell command)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "appendPlugins"
type = "list"
meaning = "managed mods run after user mods"
shape = "string[] \"plugin@marketplace\""
scopes = ["user", "managed", "session"]

[[setting]]
name = "askUserQuestionTimeout"
type = "enum"
values = ["60s", "5m", "10m", "never"]
meaning = "auto-continue unanswered questions"
scopes = ["user", "managed", "session"]

[[setting]]
name = "attribution"
type = "object"
meaning = "commit/PR attribution config; false needs v2.1.281+"
shape = "object {commit?, pr?, sessionUrl?} or false"
scopes = ["user", "project", "local", "managed", "session"]
since = "2.1.281"

[[setting]]
name = "attribution.commit"
type = "string"
meaning = "commit trailer text"
shape = "string (\"\" hides)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "attribution.pr"
type = "string"
meaning = "PR description attribution text"
shape = "string (\"\" hides)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "attribution.sessionUrl"
type = "bool"
meaning = "include claude.ai session link"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "autoCompactEnabled"
type = "bool"
meaning = "automatic compaction on/off"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "autoCompactWindow"
type = "number"
meaning = "context fill level that triggers compaction"
shape = "number tokens (min 100000, capped at model window)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "autoContinueAtUsageLimit"
type = "bool"
meaning = "auto-continue after usage-limit reset; v2.1.234+"
scopes = ["user", "managed", "session"]
since = "2.1.234"

[[setting]]
name = "autoMemoryDirectory"
type = "string"
meaning = "auto memory storage location"
shape = "string path (absolute or ~/)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "autoMemoryEnabled"
type = "bool"
meaning = "auto memory read/write on/off"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "autoMode"
type = "object"
meaning = "custom auto-mode classifier rules; include \"$defaults\" to extend"
shape = "object {environment, allow, soft_deny, hard_deny: string[]} + classifyAllShell"
scopes = ["user", "managed", "session"]

[[setting]]
name = "autoMode.classifyAllShell"
type = "bool"
meaning = "send all shell commands to classifier; v2.1.193+"
scopes = ["user", "managed", "session"]
since = "2.1.193"

[[setting]]
name = "autoScrollEnabled"
type = "bool"
meaning = "follow new output in fullscreen"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "autoUpdatesChannel"
type = "enum"
values = ["latest", "stable"]
meaning = "auto-update release channel"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "availableModels"
type = "list"
meaning = "restrict selectable models"
shape = "string[] (aliases or model IDs)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "availableModelsMatch"
type = "enum"
values = ["prefix", "exact"]
meaning = "exact version matching for model ID entries; v2.1.283+"
scopes = ["managed"]
since = "2.1.283"

[[setting]]
name = "awaySummaryEnabled"
type = "bool"
meaning = "session recap after return"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "awsAuthRefresh"
type = "string"
meaning = "refresh .aws credentials when STS check fails"
shape = "string (command)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "awsCredentialExport"
type = "string"
meaning = "command printing AWS creds as JSON"
shape = "string (command)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "axScreenReader"
type = "bool"
meaning = "screen-reader friendly output"
scopes = ["user", "managed", "session"]

[[setting]]
name = "bashEditDiffEnabled"
type = "bool"
meaning = "record files changed by Bash; v2.1.269+"
scopes = ["user", "managed", "session"]
since = "2.1.269"

[[setting]]
name = "bashOutputMaxChars"
type = "number"
meaning = "inline Bash output char limit; v2.1.261+"
shape = "integer clamped 4000–128000 (default 30000)"
scopes = ["user", "project", "local", "managed", "session"]
since = "2.1.261"

[[setting]]
name = "blockedMarketplaces"
type = "list"
meaning = "block marketplace sources"
shape = "array of marketplace source objects"
scopes = ["managed"]

[[setting]]
name = "browserExternalPageTools"
type = "enum"
values = ["disabled", "disable"]
meaning = "stop Claude tools on external pages (Desktop)"
scopes = ["managed"]

[[setting]]
name = "channelsEnabled"
type = "bool"
meaning = "allow channels for organization"
scopes = ["managed"]

[[setting]]
name = "claudeMd"
type = "string"
meaning = "organization CLAUDE.md text injected as memory"
shape = "string"
scopes = ["managed"]

[[setting]]
name = "claudeMdExcludes"
type = "list"
meaning = "skip matching CLAUDE.md files"
shape = "string[] (globs or absolute paths)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "cleanupPeriodDays"
type = "number"
meaning = "days before transcripts deleted"
shape = "integer ≥1 (default 30)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "companyAnnouncements"
type = "list"
meaning = "startup announcements (one picked at random)"
shape = "string[]"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "crossSessionInbound"
type = "enum"
values = ["accept", "hold", "refuse"]
meaning = "handling of messages from other sessions"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "defaultShell"
type = "enum"
values = ["bash", "powershell"]
meaning = "shell for ! prefix commands"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "deniedMcpServers"
type = "list"
meaning = "block matching MCP servers; wins over allowlist"
shape = "array of {serverName}|{serverCommand}|{serverUrl}"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "deniedModels"
type = "list"
meaning = "block models even if allowed; v2.1.283+"
shape = "string[] (aliases or IDs)"
scopes = ["managed"]
since = "2.1.283"

[[setting]]
name = "desktopSessionCleanupPeriodDays"
type = "number"
meaning = "transcript age limit for Desktop/Cowork"
shape = "integer ≥0 (0 = no limit); v2.1.248+"
scopes = ["user", "managed", "session"]
since = "2.1.248"

[[setting]]
name = "dialogExpiry"
type = "enum"
values = ["60s", "5m", "10m", "never"]
meaning = "deadline for forwarded remote dialogs; v2.1.224+"
scopes = ["user", "managed", "session"]
since = "2.1.224"

[[setting]]
name = "disableAgentView"
type = "bool"
meaning = "turn off background agents and agent view"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableAllHooks"
type = "bool"
meaning = "turn off hooks, custom status line, file suggestion"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableArtifact"
type = "bool"
meaning = "DEPRECATED; use enableArtifact"
scopes = ["user", "project", "local", "managed", "session"]
stability = "deprecated"

[[setting]]
name = "disableAutoMode"
type = "enum"
values = ["disable"]
meaning = "remove auto mode from mode cycle (also permissions.disableAutoMode)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableBrowserExternalNavigation"
type = "bool"
meaning = "block external browsing in Desktop Browser pane"
scopes = ["managed"]

[[setting]]
name = "disableBundledSkills"
type = "bool"
meaning = "turn off bundled skills and workflows"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableClaudeAiConnectors"
type = "bool"
meaning = "turn off claude.ai connectors; true from any file wins"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableCommandPluginSources"
type = "bool"
meaning = "block command-sourced plugins and marketplace headersHelper; v2.1.229+"
scopes = ["managed"]
since = "2.1.229"

[[setting]]
name = "disableDeepLinkRegistration"
type = "enum"
values = ["disable"]
meaning = "skip claude-cli:// handler registration"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableDesktopLocalSessions"
type = "bool"
meaning = "turn off on-device Desktop Code sessions"
scopes = ["managed"]

[[setting]]
name = "disabledMcpjsonServers"
type = "list"
meaning = "reject named project .mcp.json servers"
shape = "string[]"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableMobileSimulatorTools"
type = "bool"
meaning = "block Claude iOS Simulator tools (Desktop)"
scopes = ["managed"]

[[setting]]
name = "disableRemoteControl"
type = "bool"
meaning = "turn off Remote Control everywhere"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableRemotePreviewScripts"
type = "bool"
meaning = "no scripts in SSH/WSL HTML previews (Desktop)"
scopes = ["managed"]

[[setting]]
name = "disableSideloadFlags"
type = "bool"
meaning = "reject plugin/agent/MCP sideload CLI flags; v2.1.193+"
scopes = ["managed"]
since = "2.1.193"

[[setting]]
name = "disableSkillShellExecution"
type = "bool"
meaning = "block inline shell in skills and commands"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "disableWorkflows"
type = "bool"
meaning = "dynamic workflows off for all reached settings"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "editorMode"
type = "enum"
values = ["normal", "vim"]
meaning = "prompt key bindings"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "effortLevel"
type = "enum"
values = ["low", "medium", "high", "xhigh"]
meaning = "default effort for models without saved level"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "emojiCompletionEnabled"
type = "bool"
meaning = ":shortcode: emoji suggestions"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "enableAllProjectMcpServers"
type = "bool"
meaning = "approve all project .mcp.json servers"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "enableArtifact"
type = "bool"
meaning = "turn Artifact tool off"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "enabledMcpjsonServers"
type = "list"
meaning = "approve named project .mcp.json servers"
shape = "string[]"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "enabledPlugins"
type = "object"
meaning = "enable/disable individual plugins"
shape = "object {\"plugin@marketplace\": bool}"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "enableWorkflows"
type = "bool"
meaning = "personal dynamic-workflow toggle"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "enforceAnthropicSignIn"
type = "bool"
meaning = "require claude.ai or Enterprise Console sign-in"
scopes = ["managed"]
since = "2.1.329"

[[setting]]
name = "enforceAvailableModels"
type = "bool"
meaning = "Default option resolves inside availableModels"
scopes = ["user", "project", "local", "managed", "session"]
since = "2.1.175"

[[setting]]
name = "env"
type = "object"
meaning = "env vars for sessions and subprocesses"
shape = "object {string: string}"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "extraKnownMarketplaces"
type = "object"
meaning = "register marketplaces; alias additionalMarketplaces (v2.1.232+)"
shape = "object {name: {source: {...}, autoUpdate?}}"
scopes = ["user", "project", "local", "managed", "session"]
since = "2.1.232"

[[setting]]
name = "fallbackModel"
type = "list"
meaning = "fallback chain when primary overloaded"
shape = "array of aliases/IDs (\"default\" expands); max 3 distinct kept"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "fastMode"
type = "bool"
meaning = "fast mode on (written by /fast)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "fastModePerSessionOptIn"
type = "bool"
meaning = "require /fast each session"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "feedbackDrafts"
type = "enum"
values = ["notify", "quiet", "off"]
meaning = "Claude-drafted feedback behavior"
scopes = ["user", "managed", "session"]

[[setting]]
name = "feedbackSurveyRate"
type = "number"
meaning = "session quality survey probability"
shape = "number 0–1"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "fileCheckpointingEnabled"
type = "bool"
meaning = "file snapshots for /rewind (ignored in -p/SDK)"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "fileSuggestion"
type = "object"
meaning = "custom @ file autocomplete command"
shape = "object {type: \"command\", command}"
scopes = ["user", "project", "local", "managed", "session"]

[[setting]]
name = "footerLinksRegexes"
type = "list"
meaning = "footer badges from regex matches"
shape = "array of {type:\"regex\", pattern, url, label?}"
scopes = ["user", "managed", "session"]

[[setting]]
name = "forceLoginGatewayUrl"
type = "string"
meaning = "gateway URL for /login screen; user settings v2.1.295+"
shape = "string (full URL)"
scopes = ["user", "managed", "session"]
since = "2.1.295"

[[setting]]
name = "forceLoginMethod"
type = "enum"
values = ["claudeai", "console", "gateway"]
